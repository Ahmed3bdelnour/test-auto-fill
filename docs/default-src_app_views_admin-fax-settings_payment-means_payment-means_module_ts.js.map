<div class="row">
  <div class="col-12">
    <div class="box-head--light-blue-bg mb-3">
      <i class="fa fa-credit-card mr-2"></i>
      {{ 'fax-account-properties.payment-method-cc-header' | translate }}
      <div class="box-head__right-panel project-list-pages">
        <button class="btn" (click)="onCancelClicked()">
          {{ 'fax-account-properties.change-payment-method' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="ml-3">
  <ng-container *ngIf="showEditView; then editCC; else viewCC"></ng-container>
</div>

<ng-template #editCC>
  <div class="row mb-2">
    <div class="col-8">
      <div class="row">
        <div class="col-6">
          <app-field
            [field]="fieldName"
            appAutoFocusFirstInput
            [(value)]="creditCard.name"
            [fieldTabIndex]="1"
            [autocomplete]="'cc-name'"
          ></app-field>
        </div>
        <div class="col-6">
          <app-field [field]="fieldPhoneNumber" [(value)]="account.contactPhone" [fieldTabIndex]="2"></app-field>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="row">
            <div class="col-8 pr-0">
              <app-field
                [field]="fieldNumber"
                [(value)]="creditCard.number"
                [maxLength]="19"
                [regex]="validator.digitsRegex"
                [fieldTabIndex]="1"
                [autocomplete]="'cc-number'"
              ></app-field>
            </div>
            <div class="col-4 pl-0">
              <app-field
                [field]="fieldType"
                [(value)]="creditCard.cardType"
                [fieldTabIndex]="1"
                [autocomplete]="'cc-type'"
                [valueMapper]="mapCreditCardType"
              ></app-field>
            </div>
          </div>
        </div>
        <div class="col-6">
          <app-field [field]="fieldAddress1" [(value)]="address.address1" [fieldTabIndex]="2"></app-field>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="row">
            <div class="col-6 pr-0">
              <app-field
                [field]="fieldExpMonth"
                [(value)]="creditCard.expirationMonth"
                [fieldTabIndex]="1"
                [autocomplete]="'cc-exp-month'"
                [valueMapper]="removeUnnecessaryZerosAndDigits"
              ></app-field>
            </div>
            <div class="col-6 pl-0">
              <app-field
                [field]="fieldExpYear"
                [(value)]="creditCard.expirationYear"
                [fieldTabIndex]="1"
                [autocomplete]="'cc-exp-year'"
                [valueMapper]="removeUnnecessaryZerosAndDigits"
              ></app-field>
            </div>
          </div>
        </div>
        <div class="col-6">
          <app-field [field]="fieldAddress2" [(value)]="address.address2" [fieldTabIndex]="2"></app-field>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="row">
            <div class="col-6 pr-0">
              <app-field
                [field]="fieldCvv"
                [(value)]="creditCard.cvv"
                [maxLength]="4"
                [regex]="validator.digitsRegex"
                [fieldTabIndex]="1"
                [autocomplete]="'off'"
              ></app-field>
            </div>
            <div class="col-6 pl-0" *ngIf="accountRegistrationDetails?.country?.ownerIDRequired">
              <app-field [field]="fieldId" [(value)]="creditCard.ownerID" [fieldTabIndex]="1"></app-field>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="row">
            <div class="col-6 pr-0">
              <app-field [field]="fieldCity" [(value)]="address.city" [fieldTabIndex]="2"></app-field>
            </div>
            <div class="col-6 pl-0">
              <app-field [field]="fieldState" [(value)]="address.state" [fieldTabIndex]="2"></app-field>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6"></div>
        <div class="col-6">
          <div class="row">
            <div class="col-6 pr-0">
              <app-field [field]="fieldPostalCode" [(value)]="address.postalCode" [fieldTabIndex]="2"></app-field>
            </div>
            <div class="col-6 pl-0">
              <app-field
                [field]="fieldCountry"
                [disabled]="true"
                [(value)]="address.country"
                [fieldTabIndex]="2"
              ></app-field>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row pr-2 pt-2">
    <div class="col-8">
      <ng-container *ngTemplateOutlet="actionButtons"></ng-container>
    </div>
  </div>
</ng-template>

<ng-template #viewCC>
  <i class="fas fa-check mr-2" style="color: darkgreen"></i>
  {{ 'fax-account-properties.payment-method-cc-text' | translate }}
  <br /><br />
  <div class="credit-card ml-4">
    <div class="credit-card-name credit-card-text card-width-overflow-text">
      {{ creditCard.name }}
    </div>
    <div class="credit-card-type credit-card-text">{{ creditCard.cardType }}</div>
    <div class="credit-card-number credit-card-text">**** **** **** {{ creditCard.lastDigits }}</div>
    <div class="credit-card-expiry credit-card-text">
      {{ creditCard.expirationMonth }}/{{ creditCard.expirationYear }}
    </div>
  </div>
  <div id="card-view-action-button-container" class="ml-4 mt-4">
    <ng-container *ngTemplateOutlet="actionButtons"></ng-container>
  </div>
</ng-template>

<ng-template #actionButtons>
  <div class="d-flex flex-row-reverse">
    <button *ngIf="!showEditView" class="btn mb-2 ml-2" (click)="onUpdateClicked()">
      {{ 'MainHeader.Update' | translate }}
    </button>
  </div>
</ng-template>
