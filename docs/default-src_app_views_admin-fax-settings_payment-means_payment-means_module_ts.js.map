<div class="row">
  <div class="col-12">
    <div class="box-head--light-blue-bg mb-3">
      <i class="fa fa-university mr-2"></i>
      {{ 'fax-account-properties.payment-method-dd-header' | translate }}
      <div class="box-head__right-panel project-list-pages">
        <button class="btn" (click)="onCancelClicked()">
          {{ 'fax-account-properties.change-payment-method' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="ml-3" id="container-div">
  <div id="inner-1">
    <ng-container *ngIf="isDirectDebitConfigured; then isConfigured; else isNotConfigured"></ng-container>
  </div>
  <div id="inner-2">
    <ng-container *ngTemplateOutlet="actionButtons"></ng-container>
  </div>
</div>

<ng-template #isConfigured>
  <span>
    <i class="fas fa-check mr-2" style="color: darkgreen"></i>
    {{ 'fax-account-properties.payment-method-dd-configured' | translate }}
  </span>
</ng-template>
<ng-template #isNotConfigured>
  <span>
    <i class="fas fa-times mr-2" style="color: darkred"></i>
    {{ 'fax-account-properties.payment-method-dd-not-configured' | translate }}
  </span>
</ng-template>
<ng-template #actionButtons>
  <div class="d-flex flex-row-reverse mt-2">
    <button class="btn mt-2 ml-2" (click)="startSetup()">{{ 'MainHeader.Update' | translate }}</button>
  </div>
</ng-template>
