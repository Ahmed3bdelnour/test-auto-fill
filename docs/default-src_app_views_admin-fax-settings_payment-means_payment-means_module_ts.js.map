<div class="fluid">
  <div class="row">
    <div class="col-6">
      <app-field
        [field]="fieldName"
        [(value)]="creditCard.name"
        [autocomplete]="'cc-name'"
        [disabled]="!enabled"
        (fieldChanged)="fieldChanged()"
      >
      </app-field>
    </div>
  </div>

  <div class="row">
    <div class="col-6">
      <app-field
        [field]="fieldType"
        [(value)]="creditCard.cardType"
        [autocomplete]="'cc-type'"
        [valueMapper]="mapCreditCardType"
        [disabled]="!enabled"
        (fieldChanged)="fieldChanged()"
      ></app-field>
    </div>
  </div>

  <div class="row">
    <div class="col-6">
      <app-field
        [field]="fieldNumber"
        [(value)]="creditCard.number"
        [autocomplete]="'cc-number'"
        [maxLength]="19"
        [regex]="validator.digitsRegex"
        [disabled]="!enabled"
        (fieldChanged)="fieldChanged()"
      ></app-field>
    </div>
  </div>

  <div class="row">
    <div class="col-6">
      <app-field
        [field]="fieldExpirationMonth"
        [(value)]="creditCard.expirationMonth"
        [autocomplete]="'cc-exp-month'"
        [valueMapper]="removeUnnecessaryZerosAndDigits"
        [disabled]="!enabled"
        (fieldChanged)="fieldChanged()"
      ></app-field>
    </div>
  </div>

  <div class="row">
    <div class="col-6">
      <app-field
        [field]="fieldExpirationYear"
        [(value)]="creditCard.expirationYear"
        [autocomplete]="'cc-exp-year'"
        [valueMapper]="removeUnnecessaryZerosAndDigits"
        [disabled]="!enabled"
        (fieldChanged)="fieldChanged()"
      ></app-field>
    </div>
  </div>

  <div class="row">
    <div class="col-6">
      <app-field
        [field]="fieldCVV"
        [(value)]="creditCard.cvv"
        [autocomplete]="'off'"
        [maxLength]="4"
        [regex]="validator.digitsRegex"
        [disabled]="!enabled"
        (fieldChanged)="fieldChanged()"
      >
      </app-field>
    </div>
  </div>

  <div class="row" *ngIf="countryContext?.ownerIDRequired">
    <div class="col-6">
      <app-field [field]="fieldId" [(value)]="creditCard.ownerID" [disabled]="!enabled" (fieldChanged)="fieldChanged()">
      </app-field>
    </div>
  </div>
</div>
