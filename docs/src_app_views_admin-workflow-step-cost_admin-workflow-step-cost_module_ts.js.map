<div
  class="admin-workflow-step-cost project-list-dashboard-body d-flex flex-column container-fluid"
  appAutoFocusFirstInput
>
  <app-secondary-header
    [headerText]="'admin-workflow-step-cost.header-text' | translate"
    [rightControls]="rightControls"
  >
  </app-secondary-header>

  <div class="container-fluid col h-100" id="spinnerPanel">
    <div *ngIf="workflowStepPageLicenseCost" class="panel row m-0">
      <div
        class="col-xl-3 col-l-4 col-md-5 col-sm-6 properties-panel properties-panel-h"
        fxFlex="auto"
        [perfectScrollbar]="{ suppressScrollY: false }"
        #panelScroll="ngxPerfectScrollbar"
        [autoUpdatePerfectScroll]="panelScroll"
      >
        <app-field
          [field]="stepDisplayNameField"
          [(value)]="workflowStepPageLicenseCost.workflowStepDisplayName"
          [disabled]="true"
        ></app-field>

        <app-field [field]="costTypeField" [(value)]="baseCostType"></app-field>
        <app-field [field]="costValueField" [(value)]="baseCostValue"></app-field>
      </div>

      <div class="col-xl-9 col-l-9 col-m-8 col-md-7 col-sm-6 d-flex flex-column overflow-auto mh-100 p-0">
        <div class="panel-wrapper vcenter">
          <div class="col panel-header">
            {{ 'admin-workflow-step-cost.brand-overrides' | translate }}
          </div>
        </div>
        <div class="col pt-3 d-flex flex-column">
          <div class="d-flex pb-3 align-items-end">
            <div class="col-3 pl-0 pr-2">
              <app-field
                [field]="CreateField('', true, MetaDataType.List, brandsDataSource)"
                [(value)]="newCostBrand"
                (valueChange)="onNewCostValueChanged()"
              ></app-field>
            </div>
            <div class="col-3 pr-2 pl-2">
              <app-field
                [field]="CreateField('', true, MetaDataType.List, costTypesDataSource)"
                [(value)]="newCostTypeString"
                (valueChange)="onNewCostValueChanged()"
              ></app-field>
            </div>
            <div class="col-3 pr-0 pl-2 pr-2">
              <app-field
                [field]="CreateField('', true, MetaDataType.Decimal)"
                [(value)]="newCostValueString"
                (valueChange)="onNewCostValueChanged()"
              ></app-field>
            </div>
            <div class="d-flex align-items-center mt-3 col-3 pl-3 pr-0" style="margin-bottom: 5px">
              <button
                id="btnAddBrandOverride"
                type="button"
                class="btn btn-secondary btn-min-width"
                (click)="onAddCost()"
                [disabled]="!newCostBrand || !newCostTypeString || newCostValue < 0"
              >
                {{ 'admin-workflow-step-cost.add-brand-override' | translate }}
              </button>
            </div>
          </div>
          <div _ngcontent-ng-c3486778590="" class="panel-header d-flex pl-0 pr-0 pb-2 align-items-end pt-2">
            <div class="col col-3">{{ 'admin-workflow-step-cost.brand' | translate }}</div>
            <div class="col col-3">{{ 'admin-workflow-step-cost.base-cost-type' | translate }}</div>
            <div class="col col-3">{{ 'admin-workflow-step-cost.base-cost-value' | translate }}</div>
          </div>
          <ul
            class="list-group list-group-flush col"
            fxFlex="auto"
            [perfectScrollbar]="{ suppressScrollY: false, scrollXMarginOffset: 2, scrollYMarginOffset: 2 }"
            #tabScroll="ngxPerfectScrollbar"
            [autoUpdatePerfectScroll]="tabScroll"
          >
            <ng-container *ngFor="let cost of workflowStepPageLicenseCost.brandOverrides; let index = index">
              <li class="list-group-item d-flex align-items-center pl-0 pr-0">
                <div class="col col-3">{{ getBrandName(cost.brandID, cost.dealerID) }}</div>
                <div class="col-3 pr-0">
                  <app-field
                    [field]="CreateField('', true, MetaDataType.List, costTypesDataSource)"
                    [value]="cost.baseCostType?.toString()"
                    (valueChange)="onCostTypeChanged($event, index)"
                  ></app-field>
                </div>
                <div class="col-3 pr-0">
                  <app-field
                    [field]="CreateField('', true, MetaDataType.Decimal)"
                    [value]="cost.baseCostValue?.toString()"
                    (valueChange)="onCostValueChanged($event, index)"
                  ></app-field>
                </div>
                <i
                  id="btnDeleteDomain{{ cost.brandID }}"
                  class="icomoon-delete cursor-pointer ml-auto"
                  [title]="'Common.Remove' | translate"
                  (click)="onDeleteCost(index)"
                ></i>
              </li>
            </ng-container>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
